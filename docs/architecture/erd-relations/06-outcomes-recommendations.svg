<rect x="70" y="170" width="450" height="42" rx="0" fill="#fff0cf" stroke="#64748b"/>
<text x="86" y="198" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">MATCH_RESULT</text>
<text x="86" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK match_id : UUID</text>
<text x="86" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK student_id -&gt; STUDENT</text>
<text x="86" y="296" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (target_version_id, target_kind)</text>
<text x="86" y="324" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start"> -&gt; CONTENT_VERSION(version_id, kind)</text>
<text x="86" y="352" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (match_id, target_version_id)</text>
<text x="86" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">alg_version : required, reproducible</text>
<text x="86" y="408" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">score / mandatory result / timestamp</text>
<rect x="1130" y="170" width="400" height="250" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="1130" y="170" width="400" height="42" rx="0" fill="#def2df" stroke="#64748b"/>
<text x="1146" y="198" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">CONTENT_REQUIREMENT</text>
<text x="1146" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">KEY (version_id, skill_id)</text>
<text x="1146" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (version_id, kind) -&gt; CONTENT_VERSION</text>
<text x="1146" y="296" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK skill_id -&gt; SKILL</text>
<text x="1146" y="324" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">CHECK kind IN (&#x27;career&#x27;, &#x27;job&#x27;)</text>
<text x="1146" y="352" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">required_level / mandatory / weight</text>
<rect x="1130" y="700" width="400" height="180" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="1130" y="700" width="400" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="1146" y="728" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">SKILL</text>
<text x="1146" y="770" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK skill_id : UUID</text>
<text x="1146" y="798" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK skill_name</text>
<text x="1146" y="826" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">status : active / retired</text>
<rect x="610" y="700" width="430" height="290" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="610" y="700" width="430" height="42" rx="0" fill="#fff0cf" stroke="#64748b"/>
<text x="626" y="728" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">MATCH_SKILL_RESULT</text>
<text x="626" y="770" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">KEY (match_id, skill_id)</text>
<text x="626" y="798" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (match_id, target_version_id)</text>
<text x="626" y="826" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start"> -&gt; MATCH_RESULT</text>
<text x="626" y="854" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (target_version_id, skill_id)</text>
<text x="626" y="882" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start"> -&gt; CONTENT_REQUIREMENT</text>
<text x="626" y="910" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK skill_id -&gt; SKILL [redundant link]</text>
<rect x="70" y="1150" width="500" height="290" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="70" y="1150" width="500" height="42" rx="0" fill="#fff0cf" stroke="#64748b"/>
<text x="86" y="1178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">RECOMMENDATION</text>
<text x="86" y="1220" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK recommendation_id : UUID</text>
<text x="86" y="1248" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK match_id -&gt; MATCH_RESULT</text>
<text x="86" y="1276" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (resource_version_id, resource_kind)</text>
<text x="86" y="1304" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start"> -&gt; CONTENT_VERSION(version_id, kind)</text>
<text x="86" y="1332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (match_id, resource_version_id)</text>
<text x="86" y="1360" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">CHECK kind IN (&#x27;course&#x27;, &#x27;resource&#x27;)</text>
<rect x="1030" y="1150" width="500" height="310" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="1030" y="1150" width="500" height="42" rx="0" fill="#def2df" stroke="#64748b"/>
<text x="1046" y="1178" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">CONTENT_VERSION</text>
<text x="1046" y="1220" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK version_id : UUID</text>
<text x="1046" y="1248" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (item_id, kind) -&gt; CONTENT_ITEM</text>
<text x="1046" y="1276" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (item_id, version_no)</text>
<text x="1046" y="1304" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (version_id, kind)</text>
<text x="1046" y="1332" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK created_by -&gt; ACCOUNT</text>
<text x="1046" y="1360" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK published_by -&gt; ACCOUNT [nullable]</text>
<text x="1046" y="1388" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">REMOVE UK (item_id, kind) here</text>
<text x="60" y="1510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">Counts at an endpoint describe how many of that entity relate to one entity at the opposite end.</text>
<text x="60" y="1540" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">1 = exactly one   |   0..1 = optional one   |   0..* = zero or many   |   IDs link to relationships.md</text>
<text x="60" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#162b40" text-anchor="start">PROPOSAL ONLY  /  Keys and relationships shown; full non-key attributes remain in the supplied PNG.</text>
</svg>
