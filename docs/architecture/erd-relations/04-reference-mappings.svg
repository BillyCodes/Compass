<text x="1146" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">KEY (version_id, source_id)</text>
<text x="1146" y="698" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK version_id -&gt; CONTENT_VERSION</text>
