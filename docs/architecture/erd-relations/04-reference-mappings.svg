<text x="86" y="698" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (version_id, kind) -&gt; CONTENT_VERSION</text>
<text x="86" y="726" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK skill_id -&gt; SKILL</text>
<text x="86" y="754" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">CHECK kind IN (&#x27;career&#x27;, &#x27;job&#x27;)</text>
