<text x="636" y="1070" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK/FK version_id : one row per version</text>
<text x="636" y="1098" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (version_id, kind) -&gt; CONTENT_VERSION</text>
<text x="636" y="1126" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK company_id -&gt; COMPANY [nullable]</text>
<text x="636" y="1154" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">kind matches the actual content kind</text>
<text x="636" y="1182" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">Type-specific fields validated</text>
<rect x="1130" y="1000" width="400" height="160" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="1130" y="1000" width="400" height="42" rx="0" fill="#def2df" stroke="#64748b"/>
<text x="1146" y="1028" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">COMPANY</text>
<text x="1146" y="1070" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK company_id : UUID</text>
<text x="1146" y="1098" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">Reference organization only</text>
<text x="60" y="1510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">Counts at an endpoint describe how many of that entity relate to one entity at the opposite end.</text>
<text x="60" y="1540" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">1 = exactly one   |   0..1 = optional one   |   0..* = zero or many   |   IDs link to relationships.md</text>
<text x="60" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#162b40" text-anchor="start">PROPOSAL ONLY  /  Keys and relationships shown; full non-key attributes remain in the supplied PNG.</text>
