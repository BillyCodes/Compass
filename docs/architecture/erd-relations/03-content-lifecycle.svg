<text x="86" y="198" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">CONTENT_ITEM</text>
<text x="86" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK item_id : UUID</text>
<text x="86" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">kind : career/job/course/resource/insight</text>
<text x="86" y="296" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (item_id, kind)</text>
<text x="86" y="324" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">retired_at : nullable</text>
<rect x="70" y="620" width="500" height="310" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="70" y="620" width="500" height="42" rx="0" fill="#def2df" stroke="#64748b"/>
<text x="86" y="648" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">CONTENT_VERSION</text>
<text x="86" y="690" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK version_id : UUID</text>
<text x="86" y="718" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (item_id, kind) -&gt; CONTENT_ITEM</text>
<text x="86" y="746" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (item_id, version_no)</text>
<text x="86" y="774" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (version_id, kind)</text>
<text x="86" y="802" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK created_by -&gt; ACCOUNT</text>
<text x="86" y="830" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK published_by -&gt; ACCOUNT [nullable]</text>
<text x="86" y="858" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">REMOVE UK (item_id, kind) here</text>
<rect x="1050" y="170" width="480" height="220" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="1050" y="170" width="480" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="1066" y="198" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">ACCOUNT</text>
<text x="1066" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK account_id : UUID</text>
<text x="1066" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK login_email : email</text>
<text x="1066" y="296" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">password -&gt; password_hash</text>
<text x="1066" y="324" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">is_active : boolean</text>
<text x="1066" y="352" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">Django auth fields (see mapping)</text>
<rect x="1050" y="620" width="480" height="250" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="1050" y="620" width="480" height="42" rx="0" fill="#def2df" stroke="#64748b"/>
<text x="1066" y="648" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">CONTENT_REVIEW</text>
<text x="1066" y="690" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK review_id : UUID</text>
<text x="1066" y="718" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK version_id -&gt; CONTENT_VERSION</text>
<text x="1066" y="746" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK reviewer_id -&gt; ACCOUNT</text>
<text x="1066" y="774" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">reviewed_revision = draft revision</text>
<text x="1066" y="802" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">approval checked at publication</text>
<text x="60" y="1510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">Counts at an endpoint describe how many of that entity relate to one entity at the opposite end.</text>
<text x="60" y="1540" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">1 = exactly one   |   0..1 = optional one   |   0..* = zero or many   |   IDs link to relationships.md</text>
<text x="60" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#162b40" text-anchor="start">PROPOSAL ONLY  /  Keys and relationships shown; full non-key attributes remain in the supplied PNG.</text>
</svg>
