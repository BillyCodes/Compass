<rect x="70" y="650" width="450" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="86" y="678" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">SKILL</text>
