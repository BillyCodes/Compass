<text x="86" y="748" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK skill_name</text>
<text x="86" y="776" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">status : active / retired</text>
<rect x="1120" y="650" width="410" height="220" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="1120" y="650" width="410" height="42" rx="0" fill="#def2df" stroke="#64748b"/>
<text x="1136" y="678" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">CONTENT_ITEM</text>
<text x="1136" y="720" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK item_id : UUID</text>
<text x="1136" y="748" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">kind : career/job/course/resource/insight</text>
<text x="1136" y="776" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (item_id, kind)</text>
<text x="1136" y="804" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">retired_at : nullable</text>
<text x="60" y="1510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">Counts at an endpoint describe how many of that entity relate to one entity at the opposite end.</text>
<text x="60" y="1540" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">1 = exactly one   |   0..1 = optional one   |   0..* = zero or many   |   IDs link to relationships.md</text>
<text x="60" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#162b40" text-anchor="start">PROPOSAL ONLY  /  Keys and relationships shown; full non-key attributes remain in the supplied PNG.</text>
