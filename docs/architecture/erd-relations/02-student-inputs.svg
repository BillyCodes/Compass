<rect x="1120" y="170" width="410" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="1136" y="198" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">STUDENT_COURSE</text>
<text x="1136" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">KEY (student_id, course_item_id)</text>
<text x="1136" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK student_id -&gt; STUDENT</text>
<text x="1136" y="296" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (course_item_id, course_kind)</text>
<text x="1136" y="324" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start"> -&gt; CONTENT_ITEM(item_id, kind)</text>
<text x="1136" y="352" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">CHECK course_kind = &#x27;course&#x27;</text>
