<rect x="70" y="170" width="450" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="86" y="198" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">STUDENT_SKILL</text>
<text x="86" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">KEY (student_id, skill_id)</text>
<text x="86" y="268" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK student_id -&gt; STUDENT</text>
<text x="86" y="296" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK skill_id -&gt; SKILL</text>
<text x="86" y="324" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">proficiency_level : agreed scale</text>
