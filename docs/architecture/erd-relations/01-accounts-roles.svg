<rect x="80" y="180" width="350" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="96" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">ROLE</text>
<text x="96" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK role_id : UUID</text>
<text x="96" y="278" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK role_name : allowed role</text>
<rect x="80" y="650" width="440" height="220" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="80" y="650" width="440" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="96" y="678" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">ACCOUNT</text>
<text x="96" y="720" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK account_id : UUID</text>
<text x="96" y="748" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK login_email : email</text>
<text x="96" y="776" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">password -&gt; password_hash</text>
<text x="96" y="804" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">is_active : boolean</text>
<text x="96" y="832" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">Django auth fields (see mapping)</text>
<rect x="850" y="180" width="570" height="240" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="850" y="180" width="570" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="866" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">ACCOUNT_ROLE</text>
<text x="866" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK assignment_id : UUID [implemented]</text>
<text x="866" y="278" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (account_id, role_id)</text>
<text x="866" y="306" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK account_id -&gt; ACCOUNT [recipient]</text>
<text x="866" y="334" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK role_id -&gt; ROLE</text>
<text x="866" y="362" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK assigned_by -&gt; ACCOUNT [nullable]</text>
<rect x="850" y="650" width="570" height="180" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="850" y="650" width="570" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="866" y="678" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">STUDENT</text>
<text x="866" y="720" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK student_id : UUID</text>
<text x="866" y="748" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK/FK account_id -&gt; ACCOUNT</text>
<text x="866" y="776" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">Each student has one account</text>
<text x="60" y="1510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">Counts at an endpoint describe how many of that entity relate to one entity at the opposite end.</text>
<text x="60" y="1540" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">1 = exactly one   |   0..1 = optional one   |   0..* = zero or many   |   IDs link to relationships.md</text>
<text x="60" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#162b40" text-anchor="start">PROPOSAL ONLY  /  Keys and relationships shown; full non-key attributes remain in the supplied PNG.</text>
</svg>
