<text x="1146" y="324" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (version_id, kind)</text>
<text x="1146" y="352" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK created_by -&gt; ACCOUNT</text>
<text x="1146" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK published_by -&gt; ACCOUNT [nullable]</text>
<text x="1146" y="408" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">REMOVE UK (item_id, kind) here</text>
<rect x="610" y="550" width="430" height="310" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="610" y="550" width="430" height="42" rx="0" fill="#fff0cf" stroke="#64748b"/>
<text x="626" y="578" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">MATCH_RESULT</text>
<text x="626" y="620" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK match_id : UUID</text>
<text x="626" y="648" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK student_id -&gt; STUDENT</text>
<text x="626" y="676" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK (target_version_id, target_kind)</text>
<text x="626" y="704" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start"> -&gt; CONTENT_VERSION(version_id, kind)</text>
<text x="626" y="732" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK (match_id, target_version_id)</text>
<text x="626" y="760" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">alg_version : required, reproducible</text>
<text x="626" y="788" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">score / mandatory result / timestamp</text>
<rect x="610" y="1100" width="430" height="210" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="610" y="1100" width="430" height="42" rx="0" fill="#fff0cf" stroke="#64748b"/>
<text x="626" y="1128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">MATCH_INPUT_SKILL</text>
<text x="626" y="1170" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">KEY (match_id, skill_id)</text>
<text x="626" y="1198" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK match_id -&gt; MATCH_RESULT</text>
<text x="626" y="1226" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">FK skill_id -&gt; SKILL</text>
<text x="626" y="1254" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">level_used : saved input snapshot</text>
<rect x="70" y="1100" width="400" height="180" rx="8" fill="#ffffff" stroke="#64748b"/>
<rect x="70" y="1100" width="400" height="42" rx="0" fill="#dcecff" stroke="#64748b"/>
<text x="86" y="1128" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162b40" text-anchor="start">SKILL</text>
<text x="86" y="1170" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">PK skill_id : UUID</text>
<text x="86" y="1198" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">UK skill_name</text>
<text x="86" y="1226" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">status : active / retired</text>
<text x="60" y="1510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">Counts at an endpoint describe how many of that entity relate to one entity at the opposite end.</text>
<text x="60" y="1540" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162b40" text-anchor="start">1 = exactly one   |   0..1 = optional one   |   0..* = zero or many   |   IDs link to relationships.md</text>
<text x="60" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#162b40" text-anchor="start">PROPOSAL ONLY  /  Keys and relationships shown; full non-key attributes remain in the supplied PNG.</text>
</svg>
