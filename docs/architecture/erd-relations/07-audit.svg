<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img">
<title>Audit actor, subject, and content references</title><desc>The two ACCOUNT boxes are aliases of one table. Nullable links support system events and retained history.</desc>
<rect width="1600" height="1600" fill="#f8fafc"/>
<text x="60" y="57" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#52677a" text-anchor="start">COMPASS  /  RELATIONSHIP REVIEW</text>
<text x="60" y="105" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#162b40" text-anchor="start">Audit actor, subject, and content references</text>
<text x="60" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#162b40" text-anchor="start">The two ACCOUNT boxes are aliases of one table. Nullable links support system events and retained history.</text>
<polyline points="470,250 760,250 760,550" fill="none" stroke="#b56b15" stroke-width="2.5"/>
<rect x="474" y="217" width="52" height="25" rx="3" fill="#f8fafc" stroke="#f8fafc"/>
