{% extends "core/app_base.html" %}
{% block title %}{{ version.title }}{% endblock %}
{% block content %}
<a href="{% url 'reference:notes' %}">← Field Notes</a>
<article class="card" style="margin-top:18px">
<p class="eyebrow">Reviewed insight · version {{ version.version_no }}</p>
<h1>{{ version.title }}</h1>
<div>{{ version.body|linebreaks }}</div>
<p class="small muted">Published {{ version.published_at|date:"M j, Y" }}</p>
</article>
{% endblock %}
