{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Compass{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'draft/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/layout.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include "includes/header.html" %}
  <main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
  {% include "includes/footer.html" %}
  {% block extra_js %}{% endblock %}
</body>
</html>
