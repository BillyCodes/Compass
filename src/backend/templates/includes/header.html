{# Shared navigation. Named routes let URL paths change without editing links. #}
<header class="site-header">
  <nav class="nav" aria-label="Main navigation">
    <a class="brand" href="{% url 'core:home' %}">Compass</a>
    {% if request.user.is_authenticated %}
      <a class="brand" href="{% url 'accounts:profile' %}">Your profile</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}<button class="btn btn-primary" type="submit">Sign out</button>
      </form>
    {% else %}
      <a class="brand" href="{% url 'accounts:login' %}">Sign in</a>
    {% endif %}
  </nav>
</header>
